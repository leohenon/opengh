name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Check for a version-only release commit
        id: scope
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-release-check.mjs

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # The executable is what users run: build it and check it starts outside the checkout.
      - run: bun run build
      - run: bun run smoke
      - name: Check the install script
        run: |
          cat dist/*.tar.gz.sha256 > dist/SHA256SUMS
          OPENGH_DOWNLOAD_BASE_URL="file://$PWD/dist" OPENGH_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          bun run smoke "$RUNNER_TEMP/bin/opengh"

  nix:
    name: Nix (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: accept-flake-config = true
      # Dependencies install offline from nix/bun.lock.nix, so this also fails when that file is stale.
      - run: nix build -L
      - run: ./result/bin/opengh --version
