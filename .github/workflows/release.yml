name: Release

# Push a tag named v<version>, matching "version" in package.json, to publish executables.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.targets }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, targets: darwin-arm64 }
          - { os: macos-15-intel, targets: darwin-x64 }
          - { os: ubuntu-24.04, targets: linux-x64, musl: linux-x64-musl }
          - { os: ubuntu-24.04-arm, targets: linux-arm64, musl: linux-arm64-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Check the tag matches package.json
        run: test "v$(bun -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # The musl executables are cross-compiled, which needs their native OpenTUI packages.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun run build ${{ matrix.targets }} ${{ matrix.musl }}
      - name: Smoke test
        run: bun run smoke dist/opengh-${{ matrix.targets }}/opengh
      - name: Smoke test (musl, on Alpine)
        if: matrix.musl
        run: |
          docker run --rm -v "$PWD:/work" -w /work "oven/bun:$(bun --version)-alpine" \
            bun scripts/smoke.ts dist/opengh-${{ matrix.musl }}/opengh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opengh-${{ matrix.targets }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat *.tar.gz.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  npm:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Assemble the packages
        run: |
          for archive in dist/*.tar.gz; do tar -xzf "$archive" -C dist; done
          bun run npm:pack
      - name: Check that the packages install and run
        run: |
          npm pack ./dist/npm/opengh-linux-x64 ./dist/npm/opengh --pack-destination "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/check" "$RUNNER_TEMP"/opengh-linux-x64-*.tgz "$RUNNER_TEMP"/opengh-[0-9]*.tgz
          OPENGH_SMOKE_PATH="$(dirname "$(command -v node)")" bun run smoke "$RUNNER_TEMP/check/node_modules/.bin/opengh"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p 'require("./package.json").version')
          # Pre-releases must not become the default install.
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          cd dist/npm
          # Platform packages first: the launcher depends on them. Skipping published ones makes a rerun safe.
          for directory in opengh-*/ opengh/; do
            name=$(basename "$directory")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "./$directory" --access public --provenance --tag "$tag"
            fi
          done

  homebrew:
    name: Update the Homebrew tap
    needs: publish
    # Homebrew has no pre-release channel, and the formula must point at published archives.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: bun run brew:formula
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: leohenon/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit the formula
        working-directory: tap
        run: |
          mkdir -p Formula
          install -m 644 ../dist/homebrew/opengh.rb Formula/opengh.rb
          git add -- Formula/opengh.rb
          if git diff --cached --quiet; then
            echo "The tap already has this formula"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(homebrew): update opengh to ${GITHUB_REF_NAME#v}"
          git push origin HEAD
